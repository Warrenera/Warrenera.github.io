name: cAnnections CI/CD
on:
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      manually-deploy:
        description: Manually deploy cAnnections to GitHub Pages
        default: false
        type: boolean

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # TODO: write unit tests first
  # unit-test:
  #   if: github.event_name == "push"
  #   name: Run pytest unit tests
  #   runs-on: ubuntu-latest
  #   steps: ...

  ui-test:
    name: Selenium tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      
      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Serve site locally
        run: python -m http.server &

      - name: Wait for server
        run: sleep 2
      
      - name: Run tests
        env:
          BASE_URL: "http://localhost:8000/"
          CI: true
        run: pytest tests/ -v

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.event.pull_request.merged == 'true' || github.event.inputs.manually-deploy == 'true' }}
    name: Deploy to GitHub Pages
    needs: ui-test
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      # So upload-pages-artifactonly archives the pages the site needs.
      # _site is the default directory upload-pages-artifact looks in. 
      # See: https://github.com/actions/upload-pages-artifact#inputs-
      - name: Copy specific files to staging
        run: |
          mkdir _site/
          cp index.html _site/
          cp styles.css _site/
          cp cannections.js _site/
      
      - name: Upload artifact(s)
        uses: actions/upload-pages-artifact@v5
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
